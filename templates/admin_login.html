{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="admin-login-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="admin-login-card">
                    <div class="text-center mb-4">
                        <div class="admin-icon-wrapper mb-3">
                            <i class="fas fa-user-shield"></i>
                        </div>
                        <h2 class="admin-login-title">Admin Login</h2>
                        <p class="admin-login-subtitle">Authorized Access Only</p>
                    </div>



                    <form method="POST" action="{{ url_for('admin_login') }}">
                        <div class="mb-4">
                            <label for="student_id" class="form-label">Admin ID</label>
                            <input type="text" name="student_id" id="student_id" class="form-control" required>
                        </div>
                        <div class="mb-4 position-relative">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <input type="password" name="password" id="password" class="form-control" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                                    <i class="fas fa-eye" id="toggleIcon"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg">Login</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <a href="{{ url_for('login') }}" class="back-link">
                            <i class="fas fa-arrow-left me-1"></i> Back to Student Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript for Password Toggle -->
<script>
    function togglePassword() {
        let passwordInput = document.getElementById("password");
        let toggleIcon = document.getElementById("toggleIcon");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleIcon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
            passwordInput.type = "password";
            toggleIcon.classList.replace("fa-eye-slash", "fa-eye");
        }
    }
</script>

<style>
    .admin-login-section {
        padding: 80px 0;
        min-height: calc(100vh - 200px);
        display: flex;
        align-items: center;
    }
    
    .admin-login-card {
        background: white;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        width: 100%;
        position: relative;
        overflow: hidden;
    }
    
    .admin-login-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 5px;
        background: var(--danger-color);
    }
    
    .admin-icon-wrapper {
        width: 80px;
        height: 80px;
        background-color: rgba(239, 68, 68, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
    }
    
    .admin-icon-wrapper i {
        font-size: 2.5rem;
        color: var(--danger-color);
    }
    
    .admin-login-title {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 5px;
        color: var(--dark-color);
    }
    
    .admin-login-subtitle {
        color: var(--secondary-color);
        margin-bottom: 25px;
    }
    
    .back-link {
        color: var(--secondary-color);
        text-decoration: none;
        font-weight: 500;
        transition: 0.3s;
        font-size: 0.9rem;
    }
    
    .back-link:hover {
        color: var(--primary-color);
        text-decoration: underline;
    }
    
    @media (max-width: 767px) {
        .admin-login-card {
            padding: 30px 20px;
        }
        
        .admin-login-section {
            padding: 60px 0;
        }
        
        .admin-login-title {
            font-size: 1.5rem;
        }
    }
</style>
{% endblock %}
